<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>%sveltekit.status% — Algohub Admin</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        margin: 0;
        color: #17324d;
        background: #f3f6f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(44rem, 90vw);
        margin: 0 auto;
        padding: clamp(2rem, 8vw, 6rem) 0;
      }
      .brand {
        color: #245b5a;
        font-weight: 800;
      }
      section {
        margin-top: 3rem;
        padding: clamp(1rem, 4vw, 2rem);
        border: 1px solid #d6e1e3;
        border-radius: 0.8rem;
        background: white;
      }
      .code {
        color: #8b452e;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.1em;
      }
      h1 {
        color: #102a43;
        font-size: clamp(1.8rem, 5vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }
      p {
        line-height: 1.65;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.7rem 1rem;
        border-radius: 0.45rem;
        color: #245b5a;
        background: #eef7f5;
        text-decoration: none;
      }
      .actions .login,
      .actions .retry {
        color: white;
        background: #245b5a;
      }
      :focus-visible {
        outline: 3px solid #d77a38;
        outline-offset: 3px;
      }
      .unauthenticated,
      .forbidden,
      .login,
      .retry {
        display: none !important;
      }
      [data-status='401'] .unauthenticated,
      [data-status='403'] .forbidden {
        display: inline !important;
      }
      [data-status='401'] .other,
      [data-status='403'] .other {
        display: none;
      }
      [data-status='401'] .login,
      [data-status^='5'] .retry {
        display: inline-flex !important;
      }
    </style>
  </head>
  <body data-status="%sveltekit.status%">
    <main>
      <a class="brand" href="/">Algohub / Admin</a>
      <section aria-labelledby="error-title">
        <p class="code">%sveltekit.status% / IDENTITY</p>
        <h1 id="error-title">
          <span class="unauthenticated">Sesi berakhir atau belum masuk</span
          ><span class="forbidden">Akses tidak diizinkan</span
          ><span class="other">Halaman belum dapat dimuat</span>
        </h1>
        <p>%sveltekit.error.message%</p>
        <p>
          Akses diperiksa sebelum halaman ditampilkan. Hubungi koordinator bila
          penugasan Anda perlu diperbarui.
        </p>
        <div class="actions">
          <a class="login" href="/login">Masuk kembali</a
          ><a class="retry" href="">Coba lagi</a
          ><a href="/">Kembali ke beranda</a>
        </div>
      </section>
    </main>
  </body>
</html>
