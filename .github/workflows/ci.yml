name: phase-3-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: algohub_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: algohub_phase2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U algohub_test -d algohub_phase2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALGOHUB_TEST_DATABASE_URL: postgres://algohub_test:test-only@127.0.0.1:5432/algohub_phase2_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret pattern scan
        shell: bash
        run: |
          if git grep -nE '21st_sk_[A-Za-z0-9]{16,}|-----BEGIN [A-Z ]+PRIVATE KEY-----'; then
            printf 'Potential committed secret detected\n'
            exit 1
          fi
      - name: Frontend formatting and types
        run: npm run lint
      - name: Go formatting
        run: test -z "$(gofmt -l backend)"
      - name: Unit, database, RLS and live API contracts
        run: npm test
      - name: Go coverage artifact
        run: |
          mkdir -p coverage
          go test -count=1 -coverpkg=./backend/... -coverprofile=coverage/go.out ./backend/...
          go tool cover -func=coverage/go.out > coverage/go-summary.txt
      - name: Go race detector
        run: npm run api:test:race
      - name: Go dependency and standard-library audit
        run: npm run api:audit
      - name: Go static analysis and build
        run: npm run api:vet && npm run api:build
      - name: Frontend production builds
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Multi-host SSO and Practicum student/admin browser tests
        run: npm run test:e2e
      - name: Preserve local-fixture browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-3-browser-report
          path: |
            playwright-report/
            coverage/go.out
            coverage/go-summary.txt
          if-no-files-found: ignore
          retention-days: 7
